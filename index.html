<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a3d8f">
    <title>Wigwe University Chapel | Membership Records</title>

    <link rel="stylesheet" href="style.css">
    <script src="validation.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="chapel-header">
            <img src="assets/WULogo.png" alt="Wigwe University Chapel logo"
                 class="chapel-logo">

            <h1>WIGWE UNIVERSITY CHAPEL</h1>
            <p class="tagline">Where Academic Excellence Meets Spiritual Fire</p>
            <h2>Membership Records System</h2>
        </header>

        <form id="fellowshipForm" novalidate>
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="First Name"
                       autocomplete="given-name" required>
            </div>

            <div class="form-group">
                <label for="middleName">Middle Name</label>
                <input type="text" id="middleName" name="Middle Name"
                       autocomplete="additional-name">
            </div>

            <div class="form-group">
                <label for="lastName">Last Name (Surname)</label>
                <input type="text" id="lastName" name="Last Name"
                       autocomplete="family-name" required>
            </div>

            <div class="form-group">
                <label for="department">College/Department</label>
                <input type="text" id="department" name="Department" required>
            </div>

            <div class="form-group">
                <label for="dateOfBirth">Date of Birth</label>
                <input type="date" id="dateOfBirth" name="Date of Birth"
                       autocomplete="bday" required>
            </div>

       
            <div class="form-group">
                <label for="unit">Unit you belong to or want to join</label>
                <select id="unit" name="Unit" required>
                    <option value="" disabled selected>Select your unit</option>
                    <option value="Choir">Choir</option>
                    <option value="Prayer">Prayer</option>
                    <option value="Technical/Media">Technical/Media</option>
                    <option value="Follow Up/Evangelism">Follow Up/Evangelism</option>
                    <option value="Sunday School">Sunday School</option>
                    <option value="Women's Department">Women's Department</option>
                </select>
            </div>


            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" name="Phone Number"
                       inputmode="numeric" autocomplete="tel"
                       pattern="[0-9]{11}" maxlength="11"
                       placeholder="e.g. 08012345678"
                       title="Enter an 11-digit phone number" required>
            </div>

            <div class="form-group">
                <label for="guardianPhone">Parent/Guardian Phone</label>
                <input type="tel" id="guardianPhone" name="Guardian Phone"
                       inputmode="numeric" maxlength="11"
                       pattern="[0-9]{11}"
                       placeholder="e.g. 08012345678"
                       title="Enter an 11-digit phone number" required>
            </div>

            <div id="formMessage" class="form-message"
                 role="status" aria-live="polite" hidden></div>

            <button type="submit" id="submitButton">Submit</button>
        </form>
    </main>
</body>
</html>
